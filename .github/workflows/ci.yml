name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # No --with-deps: the ubuntu image already has the headless shell's libraries, and apt from
      # the runner's mirror once took 13 minutes.
      - run: pnpm exec playwright install chromium
      # the configured-film path, against its own fixture build (ticket 11)
      - run: pnpm build:film-fixture
      - run: pnpm e2e:film
      - name: Measure LCP (warn)
        run: pnpm perf:once
        continue-on-error: true
      - name: Audit production dependencies (warn)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  # The 3D-mic specs take 20 to 60 s each on the runner's software WebGL, so e2e runs in four shards.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      # --fully-parallel lets the shards split by test, not by file (mic.spec.ts alone is the slowest file)
      - run: pnpm e2e --shard=${{ matrix.shard }}/4 --fully-parallel
      - name: Upload Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
